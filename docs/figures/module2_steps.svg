<text x="832" y="269" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">gives ≥ 200 amino acids</text>
<text x="832" y="288" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">without a stop codon</text>
