<text x="40" y="682" font-size="14.5" fill="#1F2430" font-weight="700" text-anchor="start">With a shared archive you run all eight steps on your own computer.</text>
<text x="40" y="702" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">Steps 1–2 read the archive; steps 3–8 need only the BOLD file (or internet) and, for kc-align, a COI guide. No raw reads, MIDORI or Module 1.</text>
