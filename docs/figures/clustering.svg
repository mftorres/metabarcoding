<text x="874" y="244" font-size="14" fill="#1F2430" font-weight="650" text-anchor="start">consensus of 4 reads</text>
<rect x="862" y="270" width="214" height="66" rx="10" fill="#F4F6FA" stroke="#D5DAE2" stroke-width="1"/>
<polygon points="884.0,281.0 880.8,288.6 872.6,289.3 878.9,294.7 876.9,302.7 884.0,298.4 891.1,302.7 889.1,294.7 895.4,289.3 887.2,288.6" fill="#93AAE2" stroke="#1F2430" stroke-width="1.2"/>
