<text x="392" y="446" font-size="13" fill="#4F5666" font-weight="400" text-anchor="start">identity = identical columns ÷ aligned columns, end gaps not counted;</text>
<text x="392" y="464" font-size="13" fill="#4F5666" font-weight="400" text-anchor="start">VSEARCH tries the centroids sharing most 8-letter words first.</text>
<text x="862" y="168" font-size="16" fill="#1F2430" font-weight="700" text-anchor="start">3 · Result</text>
<rect x="862" y="188" width="214" height="66" rx="10" fill="#F4F6FA" stroke="#D5DAE2" stroke-width="1"/>
<polygon points="884.0,199.0 880.8,206.6 872.6,207.3 878.9,212.7 876.9,220.7 884.0,216.4 891.1,220.7 889.1,212.7 895.4,207.3 887.2,206.6" fill="#5D7FCB" stroke="#1F2430" stroke-width="1.2"/>
<circle cx="912" cy="211" r="8" fill="#5D7FCB"/>
<circle cx="934" cy="211" r="8" fill="#5D7FCB"/>
