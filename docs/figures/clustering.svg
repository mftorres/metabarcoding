<text x="1012" y="298" font-size="13" fill="#4F5666" font-weight="400" text-anchor="middle">cluster B</text>
<text x="874" y="326" font-size="14" fill="#1F2430" font-weight="650" text-anchor="start">consensus of 2 reads</text>
<rect x="862" y="352" width="214" height="66" rx="10" fill="#F4F6FA" stroke="#D5DAE2" stroke-width="1"/>
<polygon points="884.0,363.0 880.8,370.6 872.6,371.3 878.9,376.7 876.9,384.7 884.0,380.4 891.1,384.7 889.1,376.7 895.4,371.3 887.2,370.6" fill="#FFFFFF" stroke="#C7743C" stroke-width="1.2"/>
<text x="1012" y="380" font-size="13" fill="#4F5666" font-weight="400" text-anchor="middle">cluster C</text>
<text x="874" y="408" font-size="14" fill="#1F2430" font-weight="650" text-anchor="start">single read, kept as it is</text>
<text x="862" y="466" font-size="13" fill="#4F5666" font-weight="400" text-anchor="start">★ centroid  ● other reads</text>
<rect x="24" y="498" width="520" height="100" rx="10" fill="#F4F6FA" stroke="#D5DAE2" stroke-width="1"/>
<text x="40" y="524" font-size="15" fill="#1F2430" font-weight="700" text-anchor="start">The centroid</text>
<text x="40" y="546" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">the longest read not yet in a cluster when it is reached. Its read ID</text>
<text x="40" y="565" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">names the cluster (cluster_id, e.g. a3a699ce-677b-…). Being the longest,</text>
<text x="40" y="584" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">it often has an untrimmed end; the consensus leaves such ends out.</text>
<rect x="556" y="498" width="520" height="100" rx="10" fill="#F4F6FA" stroke="#D5DAE2" stroke-width="1"/>
<text x="572" y="524" font-size="15" fill="#1F2430" font-weight="700" text-anchor="start">Why single reads remain</text>
<text x="572" y="546" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">a read with more than about 3% errors matches no centroid and</text>
<text x="572" y="565" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">starts a cluster of its own. Most single reads are such error-rich</text>
<text x="572" y="584" font-size="13.5" fill="#4F5666" font-weight="400" text-anchor="start">reads; a few are rare variants, other organisms, chimeras or NUMTs.</text>
</svg>
