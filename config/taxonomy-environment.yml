# Linux x86_64 / WSL2 environment for the current two-module workflow.
# Direct dependency versions recorded from taxonomy on 2026-10-28.
# Re-solves transitive dependencies; this is not a platform-independent lockfile.
name: taxonomy
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.14.7
  - fastplong=0.7.1
  - vsearch=2.31.0
  - seqkit=2.13.0
  - mafft=7.526
  - kalign=3.6.0
  - kcalign=1.0.2
  - clipkit=2.14.0
  - iqtree=3.1.3
  - entrez-direct=26.0
  - baltic=1.0.0
  - biopython=1.88
  - pandas=3.0.5
  - numpy=2.5.2
  - matplotlib=3.11.1
  - nbclient=0.11.0
  - nbformat=5.11.1
  - ipykernel=7.3.0
  - jupyterlab=4.6.3
